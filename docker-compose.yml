services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: virtual-company-os-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./docker/env/app.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: virtual_company
      POSTGRES_USER: vcos
      POSTGRES_PASSWORD: vcos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcos -d virtual_company"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  queue:
    image: virtual-company-os-php
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./docker/env/app.env
    depends_on:
      - app
      - redis
    restart: unless-stopped

  scheduler:
    image: virtual-company-os-php
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./docker/env/app.env
    depends_on:
      - app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vcos
      MINIO_ROOT_PASSWORD: vcos-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    restart: unless-stopped

volumes:
  pgdata:
  minio:
